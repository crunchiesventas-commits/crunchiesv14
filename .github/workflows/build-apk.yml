name: Build Crunchies APK V14
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK 34
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp index.html android/app/src/main/assets/public/
          echo "Index copied:"
          ls -lh android/app/src/main/assets/public/
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crunchies-V14-PRO-APK-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
