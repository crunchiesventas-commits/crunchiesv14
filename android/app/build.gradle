plugins {
    id 'com.android.application'
}
android {
    namespace 'com.crunchies.snacks'
    compileSdk 34
    defaultConfig {
        applicationId "com.crunchies.snacks"
        minSdk 22
        targetSdk 34
        versionCode 15
        versionName "14.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}